name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The feature powerset, nightly. See the `powerset` job for why it is not
    # on the pull-request path.
    - cron: "17 4 * * *"

# Every job here checks out the repository, compiles it, and reports through
# the check run the platform creates on its own. None of them writes an issue,
# a comment, a release, or a package, so the token they are handed should not
# be able to. Declared once at the top rather than nine times: a job added
# later inherits the restriction instead of inheriting the default, which is
# the failure mode this block exists to prevent.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

  # `rust-toolchain.toml` pins `stable`, and a toolchain file beats the
  # toolchain `dtolnay/rust-toolchain` installs. Without an override every leg
  # of the matrix below would build with stable and the MSRV leg would prove
  # nothing. `RUSTUP_TOOLCHAIN` outranks the file, so each job sets it.
  RUSTUP_TOOLCHAIN: stable

jobs:
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.97.1", "stable"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          # `arcature_test_ci`, not `arcature_test`. The harness refuses any
          # database whose name does not start with `arcature_test_`
          # (`TEST_DB_PREFIX` in `src/test_kit/database.rs`), and
          # `arcature_test` has no trailing segment, so it fails that gate by
          # one underscore. The suffix is what the prefix is for: it names the
          # environment, so a URL pasted out of a CI log cannot be mistaken for
          # anyone's local database.
          POSTGRES_DB: arcature_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/arcature_test_ci
      # The test harness reads `ARCATURE_TEST_DB_URL`, never `DATABASE_URL`
      # -- deliberately, so a developer's working `DATABASE_URL` cannot point
      # a suite that truncates tables at a database that matters. CI setting
      # only `DATABASE_URL` therefore left every database test unconfigured
      # while looking wired up.
      ARCATURE_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/arcature_test_ci
      # A database test skips when no database is configured, so a laptop
      # with no server stays green. That is also how a suite comes to report
      # success while testing nothing, so CI turns the skip back into a
      # failure.
      ARCATURE_REQUIRE_TEST_DB: "1"
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets

      - name: Build (default features)
        run: cargo build

      # `--no-fail-fast` is not tidiness. Without it cargo stops at the first
      # test target that fails, so the remaining binaries and every doctest
      # never run -- and the log ends in a failure that names one suite while
      # saying nothing about twenty others. One red target then hides however
      # many are behind it, and the second failure only surfaces after the
      # first is fixed, one round trip at a time.
      - name: Test (default features)
        run: cargo test --no-fail-fast

      - name: Build (no default features, kernel only)
        run: cargo build --no-default-features

      - name: Build (fullstack)
        run: cargo build --features fullstack

      # Everything that does not touch a database. `jobs` and `cli` are absent
      # on purpose and are not oversights: `jobs` pulls `database` directly and
      # `cli` pulls it through `uag -> dx -> jobs`, so naming either here makes
      # this a database build with no driver, which is the one thing
      # `src/database/mod.rs` refuses to compile. `just drivers` covers them.
      - name: Build (no database)
        run: cargo build --no-default-features --features "macros,inertia,auth,validation,cache,storage-fs,mail,events,api,observe,pages,realtime,templates"

  database:
    name: Database (${{ matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: postgres
            feature: db-postgres
            url: postgres://postgres:postgres@localhost:5432/arcature_test_ci
          - driver: mysql
            feature: db-mysql
            url: mysql://root:mysql@127.0.0.1:3306/arcature_test_ci
          - driver: sqlite
            feature: db-sqlite
            url: sqlite://arcature_test_ci.db?mode=rwc

    # Both servers start on all three legs, including the SQLite one where
    # neither is used. That is not an oversight: `services` is evaluated
    # before the job begins and has no `if:`, so the alternatives are three
    # near-identical jobs or one matrix that pays about thirty seconds of
    # container start on one leg. The matrix wins -- a copied job is a job
    # that drifts, and this one exists precisely to stop the three dialects
    # from drifting apart.
    #
    # The database name is `arcature_test_ci` in every dialect because the
    # harness refuses anything not prefixed `arcature_test_`; see the `test`
    # job above.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arcature_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: arcature_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ARCATURE_TEST_DB_URL: ${{ matrix.url }}
      # See the `test` job: this is what stops a leg whose database failed
      # to start from skipping its way to green.
      ARCATURE_REQUIRE_TEST_DB: "1"

    # A lean feature set on purpose. The `drivers` job already proves the
    # full breadth *compiles* against each driver; what is missing, and what
    # this job supplies, is proof that the SQL *runs*. Three dialects times
    # the whole feature list would be three of the slowest builds in the file
    # to re-prove something already proven.
    #
    # `--lib --test test_kit` for the same reason: those two targets hold
    # every test that talks to a database. The rest of `tests/` is written
    # against the default feature set and does not compile without it.
    #
    # The rule for what belongs in the feature list, so the next addition
    # does not have to guess: a feature goes here when it carries SQL of its
    # own -- `jobs`, `session-store-db`, `auth-remember` -- because its
    # statements are otherwise never executed by anything, only compiled.
    # A feature that merely *uses* a database through one of those does not
    # earn a place; it would buy a third copy of a build already running.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Test against ${{ matrix.driver }}
        run: cargo test --no-default-features --features "auth-remember,jobs,session-store-db,test-kit,${{ matrix.feature }}" --lib --test test_kit

  drivers:
    name: Full features, per driver
    runs-on: ubuntu-latest

    # The honest equivalent of `--all-features`, which cannot work here: a
    # build speaks exactly one SQL dialect, so "all features" is three builds
    # and not one. Anything that hard-codes a driver type, or writes SQL only
    # PostgreSQL parses, fails here and nowhere else -- the `features` job pins
    # PostgreSQL and would never see it. Mirrors `just drivers`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Build the full feature set once per driver
        run: |
          feats=api,api-docs,api-tokens,auth,auth-flows,auth-remember,auth-reset,cache,cli,crypt,database,dev-proxy,dx,events,i18n,inertia,jobs,macros,mail
          feats=$feats,notifications,notifications-broadcast,notifications-db,notifications-queue,oauth,observe,otel,pages,realtime
          feats=$feats,session-store-db,signed-urls,storage-fs,storage-s3,templates,test-kit,uag,uploads,validation,views
          for driver in db-postgres db-sqlite db-mysql; do
            echo "== $driver =="
            cargo check --no-default-features --features "$feats,$driver" --all-targets
          done

  features:
    name: Each feature alone
    runs-on: ubuntu-latest

    # The flags are not tuning. They are the compile-time invariant in
    # `src/database/mod.rs` written out as cargo-hack arguments:
    #
    #   --features db-postgres     six features (`database`, `jobs`, `dx`,
    #                              `uag`, `cli`, `api-docs`) pull `database`
    #                              without naming a driver, so on their own
    #                              they hit the "needs a driver" error. The
    #                              driver is a build-wide choice like a target,
    #                              not something each feature opts into.
    #   --skip db-sqlite,db-mysql  otherwise cargo-hack adds a second driver on
    #                              top of the pinned one. The `drivers` job
    #                              gives the other two a build of their own.
    #   --exclude-all-features     `--all-features` is all three drivers at
    #                              once, which never compiles.
    #
    # `--no-dev-deps` keeps this to the library: a test file that forgets its
    # own `#![cfg(feature = ...)]` is a test-file bug, not a library one.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-hack

      - name: Every feature on its own
        run: cargo hack check --each-feature --no-dev-deps --features db-postgres --skip db-sqlite,db-mysql --exclude-all-features

  oauth:
    name: OAuth round-trip
    runs-on: ubuntu-latest

    # `oauth` is not a default feature, so the `Test` job above never
    # compiles `src/oauth/` and never runs a single line of it. `drivers`
    # names the feature but only `cargo check`s it. Until this job existed,
    # the whole authorization code flow was covered on the pull-request path
    # by nothing at all.
    #
    # It needs no secret and no network. The authorization server is an axum
    # router the test starts on a kernel-assigned `127.0.0.1` port inside the
    # test process, so this job behaves identically on a pull request from a
    # fork -- which is the only kind of OAuth test worth having in CI. One
    # that needs a real client secret is one that goes red on every outside
    # contribution and teaches everybody to ignore it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # `--no-default-features` on purpose: the default set is a database, a
      # job runner, a template engine and a CLI, none of which an OAuth flow
      # touches. Building only what the test needs also proves the feature
      # stands on its own, which `--features oauth` on top of the defaults
      # would not.
      - name: Round-trip the authorization code flow against a mock provider
        run: cargo test --no-default-features --features oauth --test oauth_round_trip

      # The property tests that were already there, on the same feature set
      # so the build above is reused. A green round trip sitting next to a
      # red property test would otherwise still never be seen on a pull
      # request.
      - name: The OAuth property tests
        run: cargo test --no-default-features --features oauth --test oauth

  telemetry:
    name: Telemetry round-trip
    runs-on: ubuntu-latest

    # Same gap as `oauth`, one feature over. `otel` is not in the default
    # set, so the `Test` job compiles none of `src/observe/otel.rs` and runs
    # neither the OTLP export tests nor the end-to-end redaction proof --
    # which is the suite that asserts what a request's secrets do and do not
    # do on their way to a collector. `features` builds the feature alone but
    # runs no test, and `drivers` only `cargo check`s it.
    #
    # `observe_prometheus` is deliberately not listed here: `observe` is a
    # default feature, so that binary already runs in `Test` on both toolchain
    # rows. Running it again would buy nothing but minutes.
    #
    # No secret and no network. The collector is a `tonic` gRPC server the
    # test binds to a kernel-assigned `127.0.0.1` port in its own process, so
    # this job behaves identically on a pull request from a fork.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # `--no-default-features` for the same reason as the job above: a
      # database, a job runner and a template engine have nothing to do with
      # an OTLP exporter, and building without them proves `otel` stands on
      # its own rather than leaning on something the default set drags in.
      - name: Export spans to a collector and check the trace context
        run: cargo test --no-default-features --features otel --test observe_otlp

      # The one that matters if it ever goes red: a request carrying a
      # password, a bearer token, a session cookie and a PKCE verifier,
      # driven through the whole stack, with every log line, span attribute
      # and metric label searched for each secret's value.
      - name: Prove redaction holds across logs, spans and metrics
        run: cargo test --no-default-features --features otel --test observe_redaction

  optional:
    name: Off-by-default features
    runs-on: ubuntu-latest

    # The `oauth` and `telemetry` jobs each closed this gap for one feature.
    # Thirteen more had it, and the arithmetic is worse for them: the
    # features named below carry a few hundred tests between them and not one
    # ran on the pull-request path. `Test` builds the default set, which
    # contains none of them. `drivers` names them, but
    # `cargo check --all-targets` compiles a test target without running it,
    # so a test that compiles and then fails its assertion is indistinguishable
    # there from one that passes.
    #
    # The tests this was hiding are the ones least affordable to lose. They
    # are the adversarial half of most of the crate's security surface: an
    # upload named `../../etc/passwd`, `CON.txt` or `a\0b`, a `.php` renamed
    # `.jpg` and caught on its magic bytes, a signed URL with one byte
    # changed, a ciphertext with one byte changed, twenty-one hostile locale
    # strings that must all fail to select anything, a login form that must
    # answer an unregistered address exactly as it answers a registered one,
    # a reset link that must be spendable once, and an access token that must
    # not be recoverable from the row that stores it. Every one of them
    # asserts that something is *rejected*, which is exactly the kind of
    # assertion that rots silently: the feature keeps working for the
    # well-behaved input that everyone tries by hand.
    #
    # One job on one combined feature set rather than one job per feature.
    # `oauth` and `telemetry` each build `--no-default-features` to prove the
    # feature stands alone, which is worth a job apiece for two subsystems
    # that genuinely have no business touching a database. These are the
    # ordinary case, `cargo hack --each-feature` already proves each one
    # compiles by itself, and a near-cold build apiece to re-prove it would
    # cost more runner time than the whole rest of this workflow.
    #
    # Adding a feature to the crate means adding it here. There is no gate
    # that catches the omission, which is how these came to be missing: the
    # feature works, its tests pass locally, and nothing goes red.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # `--no-fail-fast` for the reason given in `Test`, and it bites harder
      # here: this is the only place these suites run at all, so a stop at the
      # first failure leaves the rest unreported with nowhere else to catch
      # them. The doctests come along with it -- `i18n` alone adds seventeen,
      # and a doctest is the one kind of example that goes stale without
      # anybody editing it.
      #
      # The list is every off-by-default feature that nothing else runs. The
      # rest are accounted for: `db-sqlite` and `db-mysql` belong to
      # `drivers`; `session-store-db` and `auth-remember` belong to
      # `database`, which runs them against all three dialects, and that is
      # the only way their tests mean anything -- each asserts a property of
      # the SQL that an in-memory double would agree with for free; `oauth` and `otel` have a job apiece; `test-kit` is the
      # harness those jobs use rather than a subject; and `dev-proxy`,
      # `templates` and `uag` are enabled by `cli`, which is in the default
      # set, so their suites already run in `Test`. That leaves `api-docs`,
      # which is an alias for `api` plus `uag` and has no code of its own.
      - name: Test the features the default set leaves out
        run: >-
          cargo test --no-fail-fast --features
          crypt,signed-urls,uploads,views,i18n,storage-s3,auth-flows,auth-reset,api-tokens,notifications,notifications-db,notifications-broadcast,notifications-queue

  typescript:
    name: Generated TypeScript
    runs-on: ubuntu-latest

    # `uag` is in the default set (`cli` pulls it), so `Test` already builds
    # and runs `tests/uag_typescript.rs`. It passes there without proving
    # anything: three of its six tests need a TypeScript compiler, find none,
    # and return early. A test that skips is indistinguishable from a test
    # that passes in the summary line, so the proof needs a job that is
    # guaranteed to have the compiler -- and that goes red rather than quiet
    # if it ever stops having one.
    #
    # The self-skip is deliberate and stays: `docs/decisions/0001-no-npm-
    # package.md` means a contributor gets no npm install from this repo, and
    # a suite that cannot be run without one would be a suite nobody runs.
    # Local is opt-in via ARCATURE_TSC; CI is where it is mandatory.
    #
    # No `actions/setup-node`: the runner image ships Node, and an action not
    # added is a pinned SHA not maintained and a supply chain not widened.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # Pinned, and one package: `typescript` declares no dependencies, so
      # this adds exactly what it names. The version is pinned because the
      # test asserts the diagnostic *code* tsc raises for each rejected
      # snippet -- TS2353 for an excess property, TS2322 for a mistyped one --
      # and those are the difference between "the mistake was caught" and
      # "something went wrong". A floating version would let that drift into
      # a red build nobody asked for.
      - name: Install the TypeScript compiler
        run: npm install --no-save --no-audit --no-fund typescript@5.9.3

      # Set explicitly rather than leaning on the test's own search for a
      # vendored `node_modules`. When ARCATURE_TSC is set the test asserts
      # the compiler runs; when it is unset a wrong path is a silent skip,
      # which is the exact failure this job exists to rule out.
      - name: Type-check the generated route table
        env:
          ARCATURE_TSC: ${{ github.workspace }}/node_modules/typescript/bin/tsc
        run: cargo test --features uag --test uag_typescript

  powerset:
    name: Feature powerset (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    # Not on the pull-request path. The crate has 41 features, so an uncapped
    # powerset is a six-figure number of builds -- not slow, unrunnable. No
    # exact count is quoted for it: that number moves with every feature added
    # and is never acted on, unlike the two depths below. `--depth 2` is 696,
    # and pairwise is where feature-interaction bugs actually live: a feature
    # that breaks alone is caught by the `features` job, and one that breaks
    # only in a specific trio is rare enough not to be worth three orders of
    # magnitude. Even 696 is too much to put in front of every pull request,
    # so it runs once a night. Raise the depth to 3 (7,277 builds) when
    # chasing one.
    #
    # `--skip database` on top of the pinned driver: `db-postgres` already
    # enables it, so including it again only doubles the subsets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-hack

      - name: All feature pairs
        run: cargo hack build --feature-powerset --depth 2 --features db-postgres --skip database,db-sqlite,db-mysql --exclude-all-features --keep-going

  scaffold:
    name: Scaffold and compile
    runs-on: ubuntu-latest

    # What `arc new` writes has to compile. There used to be four application
    # packages under `examples/` making this point by existing; they were empty,
    # so they made it only in the manifest comment. Generating the tree here
    # instead means the layout under test is the one the templates produce, and
    # there is no second copy to keep in sync.
    # Three stacks by three drivers. The driver axis is not padding: it picks a
    # different set of `arcature` features and a different migration dialect,
    # and a template that only ever compiled against SQLite is a template that
    # breaks on someone's first `--db postgres`.
    strategy:
      fail-fast: false
      matrix:
        stack: [react, vue, svelte]
        db: [sqlite, postgres, mysql]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Build the CLI
        run: cargo build --bin arc --features cli

      - name: Scaffold
        run: ./target/debug/arc new app --stack ${{ matrix.stack }} --db ${{ matrix.db }}

      # The patch below makes the pinned version irrelevant to this job, which
      # means a pin that resolves nowhere would still go green here and then
      # fail on the first `arc new` a stranger runs. A warning rather than an
      # error: between bumping the manifest and tagging the release the pin is
      # supposed to be unpublished.
      - name: Check the pinned version exists on crates.io
        if: matrix.stack == 'react' && matrix.db == 'sqlite'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^arcature = { version = "\([^"]*\)".*/\1/p' app/Cargo.toml | head -1)
          echo "arc new pinned arcature = $version"
          if curl -sSf "https://index.crates.io/ar/ca/arcature" \
               | jq -e --arg v "$version" 'select(.vers == $v)' > /dev/null; then
            echo "ok    crates.io serves arcature $version"
          else
            echo "::warning::arc new writes arcature $version, which crates.io does not serve. Expected while a release is being prepared; a problem if it outlives the next tag."
          fi

      # `arc new` writes a normal `arcature = "<version>"` dependency, and that
      # is what a real user gets. CI cannot build against it, though: resolving
      # the registry copy would test the last release, which is the one thing
      # this job is not here to test. So the generated project is pointed at
      # the working tree it was generated from, and that is permanent -- this
      # step is not a bootstrap waiting on the first `cargo publish`.
      #
      # What the patch does hide is a pin that resolves nowhere, so the step
      # above checks for that separately.
      - name: Point the generated project at this checkout
        run: |
          {
            echo ""
            echo "[patch.crates-io]"
            echo 'arcature = { path = ".." }'
          } >> app/Cargo.toml

      - name: Compile it
        working-directory: app
        run: cargo build

      # Only on the SQLite leg. The scaffold's smoke test boots the application,
      # and on the other two drivers that means connecting to a server this job
      # does not run. Compiling is the gate for those; SQLite is where the test
      # suite the template ships actually gets executed.
      - name: Its own test suite
        if: matrix.db == 'sqlite'
        working-directory: app
        run: cargo test

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  book:
    name: Guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: mdbook

      - name: Build the guide
        run: mdbook build docs

  publish-dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.97.1"

      # `arcature-macros` first, and unconditionally. It depends on nothing this
      # workspace publishes, so its dry run is meaningful today, and it is the
      # crate that has to go out first anyway.
      - name: cargo publish --dry-run -p arcature-macros
        run: cargo publish --dry-run -p arcature-macros
        env:
          RUSTUP_TOOLCHAIN: "1.97.1"

      # This step used to be guarded on whether the sparse index served
      # `arcature-macros` at all. Packaging `arcature` resolves
      # `arcature-macros = { version = "=<same version>", path = "macros" }`
      # against the registry -- `--no-verify` skips the build, not the resolve
      # -- so before the first publish it could only report
      #
      #     no matching package named `arcature-macros` found
      #
      # and a required job that cannot pass makes the gate meaningless.
      #
      # The guard is gone because it can no longer be false. `arcature-macros`
      # 0.1.0 is published, and a published version stays in the index for
      # good: yanking sets `yanked: true` on the entry rather than removing it,
      # and a version number can never be reused. A condition that is now
      # permanently true reads as though the unpublished case is still live.
      #
      # The dry run does still fail when the *pinned* version is unpublished,
      # which is right. Between bumping the manifest and tagging, publishing
      # macros first is the release job's business; this step going red on
      # `main` afterwards means that ordering broke.
      - name: cargo publish --dry-run -p arcature
        run: cargo publish --dry-run -p arcature
        env:
          RUSTUP_TOOLCHAIN: "1.97.1"

  # ---------------------------------------------------------------------------
  # The one check branch protection requires.
  #
  # `main` requires exactly one status check: this job. Listing the real jobs
  # individually would work today and rot tomorrow -- `test` and `scaffold` are
  # matrices, so their check names carry their matrix values (`Test (stable)`,
  # `Scaffold and compile (react, sqlite)`), and adding a stack, a driver or a
  # toolchain silently adds a check that protection does not require. A leg that
  # nobody requires is a leg that can go red without blocking a merge.
  #
  # `if: always()` is what makes this a gate rather than a formality. Without
  # it the job is skipped when anything it needs fails, and a skipped required
  # check reads to the merge button as "not failing".
  #
  # `powerset` is deliberately absent: it only runs on the schedule, so
  # requiring it would leave every pull request waiting on a job that never
  # starts.
  ci-success:
    name: CI success
    if: always()
    needs:
      - test
      - database
      - drivers
      - features
      - oauth
      - telemetry
      - optional
      - typescript
      - scaffold
      - deny
      - book
      - publish-dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        # `cancelled` and `skipped` are failures here for the same reason
        # `always()` is above: neither one is a green build, and treating
        # either as passing hands the merge button a result nobody produced.
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: |
          echo "One or more required jobs did not succeed."
          exit 1

      - name: Report
        run: echo "Every required job succeeded."
