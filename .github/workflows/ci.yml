name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The feature powerset, nightly. See the `powerset` job for why it is not
    # on the pull-request path.
    - cron: "17 4 * * *"

# Every job here checks out the repository, compiles it, and reports through
# the check run the platform creates on its own. None of them writes an issue,
# a comment, a release, or a package, so the token they are handed should not
# be able to. Declared once at the top rather than nine times: a job added
# later inherits the restriction instead of inheriting the default, which is
# the failure mode this block exists to prevent.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

  # `rust-toolchain.toml` pins `stable`, and a toolchain file beats the
  # toolchain `dtolnay/rust-toolchain` installs. Without an override every leg
  # of the matrix below would build with stable and the MSRV leg would prove
  # nothing. `RUSTUP_TOOLCHAIN` outranks the file, so each job sets it.
  RUSTUP_TOOLCHAIN: stable

jobs:
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.97.1", "stable"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          # `arcature_test_ci`, not `arcature_test`. The harness refuses any
          # database whose name does not start with `arcature_test_`
          # (`TEST_DB_PREFIX` in `src/test_kit/database.rs`), and
          # `arcature_test` has no trailing segment, so it fails that gate by
          # one underscore. The suffix is what the prefix is for: it names the
          # environment, so a URL pasted out of a CI log cannot be mistaken for
          # anyone's local database.
          POSTGRES_DB: arcature_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/arcature_test_ci
      # The test harness reads `ARCATURE_TEST_DB_URL`, never `DATABASE_URL`
      # -- deliberately, so a developer's working `DATABASE_URL` cannot point
      # a suite that truncates tables at a database that matters. CI setting
      # only `DATABASE_URL` therefore left every database test unconfigured
      # while looking wired up.
      ARCATURE_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/arcature_test_ci
      # A database test skips when no database is configured, so a laptop
      # with no server stays green. That is also how a suite comes to report
      # success while testing nothing, so CI turns the skip back into a
      # failure.
      ARCATURE_REQUIRE_TEST_DB: "1"
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets

      - name: Build (default features)
        run: cargo build

      - name: Test (default features)
        run: cargo test

      - name: Build (no default features, kernel only)
        run: cargo build --no-default-features

      - name: Build (fullstack)
        run: cargo build --features fullstack

      # Everything that does not touch a database. `jobs` and `cli` are absent
      # on purpose and are not oversights: `jobs` pulls `database` directly and
      # `cli` pulls it through `uag -> dx -> jobs`, so naming either here makes
      # this a database build with no driver, which is the one thing
      # `src/database/mod.rs` refuses to compile. `just drivers` covers them.
      - name: Build (no database)
        run: cargo build --no-default-features --features "macros,inertia,auth,validation,cache,storage-fs,mail,events,api,observe,pages,realtime,templates"

  database:
    name: Database (${{ matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: postgres
            feature: db-postgres
            url: postgres://postgres:postgres@localhost:5432/arcature_test_ci
          - driver: mysql
            feature: db-mysql
            url: mysql://root:mysql@127.0.0.1:3306/arcature_test_ci
          - driver: sqlite
            feature: db-sqlite
            url: sqlite://arcature_test_ci.db?mode=rwc

    # Both servers start on all three legs, including the SQLite one where
    # neither is used. That is not an oversight: `services` is evaluated
    # before the job begins and has no `if:`, so the alternatives are three
    # near-identical jobs or one matrix that pays about thirty seconds of
    # container start on one leg. The matrix wins -- a copied job is a job
    # that drifts, and this one exists precisely to stop the three dialects
    # from drifting apart.
    #
    # The database name is `arcature_test_ci` in every dialect because the
    # harness refuses anything not prefixed `arcature_test_`; see the `test`
    # job above.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arcature_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: arcature_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ARCATURE_TEST_DB_URL: ${{ matrix.url }}
      # See the `test` job: this is what stops a leg whose database failed
      # to start from skipping its way to green.
      ARCATURE_REQUIRE_TEST_DB: "1"

    # A lean feature set on purpose. The `drivers` job already proves the
    # full breadth *compiles* against each driver; what is missing, and what
    # this job supplies, is proof that the SQL *runs*. Three dialects times
    # the whole feature list would be three of the slowest builds in the file
    # to re-prove something already proven.
    #
    # `--lib --test test_kit` for the same reason: those two targets hold
    # every test that talks to a database. The rest of `tests/` is written
    # against the default feature set and does not compile without it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Test against ${{ matrix.driver }}
        run: cargo test --no-default-features --features "jobs,session-store-db,test-kit,${{ matrix.feature }}" --lib --test test_kit

  drivers:
    name: Full features, per driver
    runs-on: ubuntu-latest

    # The honest equivalent of `--all-features`, which cannot work here: a
    # build speaks exactly one SQL dialect, so "all features" is three builds
    # and not one. Anything that hard-codes a driver type, or writes SQL only
    # PostgreSQL parses, fails here and nowhere else -- the `features` job pins
    # PostgreSQL and would never see it. Mirrors `just drivers`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Build the full feature set once per driver
        run: |
          feats=api,api-docs,auth,cache,cli,crypt,database,dev-proxy,dx,events,inertia,jobs,macros,mail
          feats=$feats,oauth,observe,otel,pages,realtime,session-store-db,signed-urls,storage-fs,storage-s3,templates,test-kit,uag,uploads,validation,views
          for driver in db-postgres db-sqlite db-mysql; do
            echo "== $driver =="
            cargo check --no-default-features --features "$feats,$driver" --all-targets
          done

  features:
    name: Each feature alone
    runs-on: ubuntu-latest

    # The flags are not tuning. They are the compile-time invariant in
    # `src/database/mod.rs` written out as cargo-hack arguments:
    #
    #   --features db-postgres     six features (`database`, `jobs`, `dx`,
    #                              `uag`, `cli`, `api-docs`) pull `database`
    #                              without naming a driver, so on their own
    #                              they hit the "needs a driver" error. The
    #                              driver is a build-wide choice like a target,
    #                              not something each feature opts into.
    #   --skip db-sqlite,db-mysql  otherwise cargo-hack adds a second driver on
    #                              top of the pinned one. The `drivers` job
    #                              gives the other two a build of their own.
    #   --exclude-all-features     `--all-features` is all three drivers at
    #                              once, which never compiles.
    #
    # `--no-dev-deps` keeps this to the library: a test file that forgets its
    # own `#![cfg(feature = ...)]` is a test-file bug, not a library one.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-hack

      - name: Every feature on its own
        run: cargo hack check --each-feature --no-dev-deps --features db-postgres --skip db-sqlite,db-mysql --exclude-all-features

  powerset:
    name: Feature powerset (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    # Not on the pull-request path. The crate has 34 features, so an uncapped
    # powerset is a six-figure number of builds -- not slow, unrunnable. No
    # exact count is quoted for it: that number moves with every feature added
    # and is never acted on, unlike the two depths below. `--depth 2` is 398,
    # and pairwise is where feature-interaction bugs actually live: a feature
    # that breaks alone is caught by the `features` job, and one that breaks
    # only in a specific trio is rare enough not to be worth three orders of
    # magnitude. Even 398 is too much to put in front of every pull request,
    # so it runs once a night. Raise the depth to 3 (3,086 builds) when
    # chasing one.
    #
    # `--skip database` on top of the pinned driver: `db-postgres` already
    # enables it, so including it again only doubles the subsets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-hack

      - name: All feature pairs
        run: cargo hack build --feature-powerset --depth 2 --features db-postgres --skip database,db-sqlite,db-mysql --exclude-all-features --keep-going

  scaffold:
    name: Scaffold and compile
    runs-on: ubuntu-latest

    # What `arc new` writes has to compile. There used to be four application
    # packages under `examples/` making this point by existing; they were empty,
    # so they made it only in the manifest comment. Generating the tree here
    # instead means the layout under test is the one the templates produce, and
    # there is no second copy to keep in sync.
    # Three stacks by three drivers. The driver axis is not padding: it picks a
    # different set of `arcature` features and a different migration dialect,
    # and a template that only ever compiled against SQLite is a template that
    # breaks on someone's first `--db postgres`.
    strategy:
      fail-fast: false
      matrix:
        stack: [react, vue, svelte]
        db: [sqlite, postgres, mysql]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Build the CLI
        run: cargo build --bin arc --features cli

      - name: Scaffold
        run: ./target/debug/arc new app --stack ${{ matrix.stack }} --db ${{ matrix.db }}

      # The patch below makes the pinned version irrelevant to this job, which
      # means a pin that resolves nowhere would still go green here and then
      # fail on the first `arc new` a stranger runs. A warning rather than an
      # error: between bumping the manifest and tagging the release the pin is
      # supposed to be unpublished.
      - name: Check the pinned version exists on crates.io
        if: matrix.stack == 'react' && matrix.db == 'sqlite'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^arcature = { version = "\([^"]*\)".*/\1/p' app/Cargo.toml | head -1)
          echo "arc new pinned arcature = $version"
          if curl -sSf "https://index.crates.io/ar/ca/arcature" \
               | jq -e --arg v "$version" 'select(.vers == $v)' > /dev/null; then
            echo "ok    crates.io serves arcature $version"
          else
            echo "::warning::arc new writes arcature $version, which crates.io does not serve. Expected while a release is being prepared; a problem if it outlives the next tag."
          fi

      # `arc new` writes a normal `arcature = "<version>"` dependency, and that
      # is what a real user gets. CI cannot build against it, though: resolving
      # the registry copy would test the last release, which is the one thing
      # this job is not here to test. So the generated project is pointed at
      # the working tree it was generated from, and that is permanent -- this
      # step is not a bootstrap waiting on the first `cargo publish`.
      #
      # What the patch does hide is a pin that resolves nowhere, so the step
      # above checks for that separately.
      - name: Point the generated project at this checkout
        run: |
          {
            echo ""
            echo "[patch.crates-io]"
            echo 'arcature = { path = ".." }'
          } >> app/Cargo.toml

      - name: Compile it
        working-directory: app
        run: cargo build

      # Only on the SQLite leg. The scaffold's smoke test boots the application,
      # and on the other two drivers that means connecting to a server this job
      # does not run. Compiling is the gate for those; SQLite is where the test
      # suite the template ships actually gets executed.
      - name: Its own test suite
        if: matrix.db == 'sqlite'
        working-directory: app
        run: cargo test

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  book:
    name: Guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: mdbook

      - name: Build the guide
        run: mdbook build docs

  publish-dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.97.1"

      # `arcature-macros` first, and unconditionally. It depends on nothing this
      # workspace publishes, so its dry run is meaningful today, and it is the
      # crate that has to go out first anyway.
      - name: cargo publish --dry-run -p arcature-macros
        run: cargo publish --dry-run -p arcature-macros
        env:
          RUSTUP_TOOLCHAIN: "1.97.1"

      # This step used to be guarded on whether the sparse index served
      # `arcature-macros` at all. Packaging `arcature` resolves
      # `arcature-macros = { version = "=<same version>", path = "macros" }`
      # against the registry -- `--no-verify` skips the build, not the resolve
      # -- so before the first publish it could only report
      #
      #     no matching package named `arcature-macros` found
      #
      # and a required job that cannot pass makes the gate meaningless.
      #
      # The guard is gone because it can no longer be false. `arcature-macros`
      # 0.1.0 is published, and a published version stays in the index for
      # good: yanking sets `yanked: true` on the entry rather than removing it,
      # and a version number can never be reused. A condition that is now
      # permanently true reads as though the unpublished case is still live.
      #
      # The dry run does still fail when the *pinned* version is unpublished,
      # which is right. Between bumping the manifest and tagging, publishing
      # macros first is the release job's business; this step going red on
      # `main` afterwards means that ordering broke.
      - name: cargo publish --dry-run -p arcature
        run: cargo publish --dry-run -p arcature
        env:
          RUSTUP_TOOLCHAIN: "1.97.1"

  # ---------------------------------------------------------------------------
  # The one check branch protection requires.
  #
  # `main` requires exactly one status check: this job. Listing the real jobs
  # individually would work today and rot tomorrow -- `test` and `scaffold` are
  # matrices, so their check names carry their matrix values (`Test (stable)`,
  # `Scaffold and compile (react, sqlite)`), and adding a stack, a driver or a
  # toolchain silently adds a check that protection does not require. A leg that
  # nobody requires is a leg that can go red without blocking a merge.
  #
  # `if: always()` is what makes this a gate rather than a formality. Without
  # it the job is skipped when anything it needs fails, and a skipped required
  # check reads to the merge button as "not failing".
  #
  # `powerset` is deliberately absent: it only runs on the schedule, so
  # requiring it would leave every pull request waiting on a job that never
  # starts.
  ci-success:
    name: CI success
    if: always()
    needs:
      - test
      - database
      - drivers
      - features
      - scaffold
      - deny
      - book
      - publish-dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        # `cancelled` and `skipped` are failures here for the same reason
        # `always()` is above: neither one is a green build, and treating
        # either as passing hands the merge button a result nobody produced.
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: |
          echo "One or more required jobs did not succeed."
          exit 1

      - name: Report
        run: echo "Every required job succeeded."
