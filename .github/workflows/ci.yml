name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

  # `rust-toolchain.toml` pins `stable`, and a toolchain file beats the
  # toolchain `dtolnay/rust-toolchain` installs. Without an override every leg
  # of the matrix below would build with stable and the MSRV leg would prove
  # nothing. `RUSTUP_TOOLCHAIN` outranks the file, so each job sets it.
  RUSTUP_TOOLCHAIN: stable

jobs:
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.97.1", "stable"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arcature_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/arcature_test
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets

      - name: Build (default features)
        run: cargo build

      - name: Test (default features)
        run: cargo test

      - name: Build (no default features, kernel only)
        run: cargo build --no-default-features

      - name: Build (fullstack)
        run: cargo build --features fullstack

      - name: Build (no DB, no macros subset)
        run: cargo build --no-default-features --features "macros,inertia,auth,validation,cache,storage-fs,mail,jobs,events,api,observe,pages,realtime,cli,templates"

      # Every feature on its own. The powerset below is the thorough check,
      # but it is slow and `--keep-going`, so a single broken feature is easy
      # to miss in its output; this one fails fast and names the culprit.
      # `--no-dev-deps` keeps it to the library: a test file that forgets its
      # own `#![cfg(feature = ...)]` is a test-file bug, not a library one.
      - name: Each feature alone (library only)
        run: cargo hack check --each-feature --no-dev-deps

      - name: Feature powerset (build only, skip DB-needing subsets)
        run: cargo hack build --feature-powerset --skip database --keep-going

  publish-dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: cargo publish --dry-run (workspace excludes macros)
        run: cargo publish --dry-run --no-verify
