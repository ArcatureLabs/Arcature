# Put every new issue on the roadmap board.
#
# Without this, the board is only ever as current as the last time someone
# remembered to drag an issue onto it, which is a tracker that quietly lies
# about what is outstanding. Adding on `opened` means the board is complete by
# construction and triage is the act of setting fields, not of remembering.
#
# Fields are deliberately not set here. Status, Priority, Area and Proof are
# triage judgements, and a workflow that guessed them would produce a board
# full of confident defaults nobody chose.
#
# Pull requests are not added. They live and die inside a week and would bury
# the work items the board exists to show.

name: Add to project

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: add-to-project-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  add:
    name: Add the issue to the roadmap
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN cannot write to a Projects v2 board -- project
    # scope is not among the permissions it can be granted. This needs a PAT
    # with `project`, stored as ADD_TO_PROJECT_TOKEN. Skip rather than fail
    # when it is absent, so a fork or a token-less repository does not show a
    # red cross on every issue it opens.
    if: ${{ github.repository == 'ArcatureLabs/Arcature' }}
    steps:
      - name: Add
        uses: actions/add-to-project@v2
        continue-on-error: true
        with:
          project-url: https://github.com/orgs/ArcatureLabs/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT_TOKEN }}
