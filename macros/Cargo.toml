[package]
name = "arcature-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/ArcatureLabs/Arcature"
description = "Proc-macro crate for Arcature: #[model], #[request], #[controller], #[derive(Job)], #[derive(Event)]."
categories = ["web-programming", "development-tools"]
keywords = ["web", "framework", "arcature", "macro", "proc-macro"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0", features = ["full", "parsing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
