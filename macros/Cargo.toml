[package]
name = "arcature-macros"
version = "2026.3.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
description = "Proc-macro crate for Arcature: #[model], #[request], #[controller], #[derive(Job)], #[derive(Event)]."
publish = false

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
