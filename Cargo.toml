[package]
name = "arcature"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/ArcatureLabs/Arcature"
homepage = "https://arcaturelabs.github.io/Arcature/"
documentation = "https://docs.rs/arcature"
readme = "README.md"
description = "Arcature: an opinionated full-stack Rust web framework. One package, batteries included."
categories = [
    "web-programming",
    "web-programming::http-server",
    "asynchronous",
    "development-tools",
]
keywords = ["web", "framework", "axum", "inertia", "arcature"]

# The `arc` CLI ships from the same package as a binary target. A normal
# application never compiles the CLI; the binary is only built by
# `cargo install arcature` / `cargo build --bin arc`.
[[bin]]
name = "arc"
path = "src/bin/arc.rs"
required-features = ["cli"]

[lib]
name = "arcature"
path = "src/lib.rs"

# ---------------------------------------------------------------------------
# Workspace — the proc-macro crate lives alongside `arcature` as a path dep.
# Only `arcature` is the public release unit; `arcature-macros` is an
# implementation detail Rust requires (proc-macros must be a separate crate).
#
# There is no `examples/` directory, and its absence is the deliberate half of
# a trade. Four application packages used to be members here, on the argument
# that "the layout `arc new` writes is the layout CI compiles" — but they were
# four one-line placeholders, so they compiled nothing and proved nothing, and
# every template change would have had to be copied into all four by hand or
# they would drift into lying about the layout.
#
# The property was worth keeping; the copies were not. CI's `scaffold` job runs
# `arc new` for each stack and compiles what comes out, so the layout under
# test is the one the templates actually produce, on every run, with nothing to
# keep in sync. `just scaffold` is the same thing locally.
# ---------------------------------------------------------------------------
[workspace]
members = [".", "macros"]

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
#
# Arcature is one release unit. Features exist only to reduce compile surface,
# never to turn the framework into a self-assembly kit. `cargo add arcature`
# (the default) is batteries-included: it compiles the canonical generated
# application with no extra flags.
#
# Heavy operator integrations (OpenTelemetry exporter, S3, interactive API
# docs, TLS variants) stay opt-in so a default app does not pull them.
[features]
default = [
    "macros",
    "dx",
    "inertia",
    "database",
    "db-postgres",
    "auth",
    "validation",
    "cache",
    "storage-fs",
    "mail",
    "jobs",
    "events",
    "api",
    "observe",
    "pages",
    "realtime",
    "cli",
    "templates",
]

# The runtime + lifecycle + #[arcature::main] entry point. Without this an
# expert can still build a raw Axum app over the kernel; with it the
# generated app's `main.rs` needs no direct tokio dependency.
macros = [
    "dep:arcature-macros",
    "dep:tokio",
    "dep:tokio-util",
    "dep:hyper",
    "dep:hyper-util",
]

# The Arcature application DX layer: the unified DSL (`module!`,
# `application!`, `routes!`, `#[service]`, `#[resource]`, `#[page]`, etc.)
# and the runtime contracts those macros generate code against
# (`ApplicationGraph`, `ModuleDescriptor`, `Resolve<S>`, `Service`, `Bound`,
# `Command`, etc.). Implies `macros` (the DSL macros) and `events` + `jobs`
# (the runtime modules whose binding-metadata types `ModuleDescriptor`
# aggregates). Database-bound contracts (`RouteModel`, `Bound<T>`,
# `DbFromState`) are cross-gated on `dx` + `database` (+ `api` for `Bound`).
dx = ["macros", "events", "jobs"]

# Native Inertia.js server protocol implementation.
inertia = ["dep:http"]

# Database: one pool shared by SeaORM + SQLx, models, migrations,
# transactions, raw-SQL escape hatch.
#
# Driver-neutral on its own: it brings the crates but not a driver, so
# enabling `database` alone gives a build that cannot connect to anything.
# Pick exactly one of `db-postgres` / `db-sqlite` / `db-mysql` -- `default`
# picks `db-postgres`. Splitting them is what lets one crate serve all three
# without SQLite users compiling the Postgres protocol.
database = [
    "dep:sqlx",
    "dep:sea-orm",
    "dep:sea-orm-migration",
    "dep:chrono",
    "dep:uuid",
]

# The database drivers. Exactly one belongs in a given build.
db-postgres = [
    "database",
    "sqlx/postgres",
    "sea-orm/sqlx-postgres",
    "sea-orm-migration/sqlx-postgres",
]
db-sqlite = [
    "database",
    "sqlx/sqlite",
    "sea-orm/sqlx-sqlite",
    "sea-orm-migration/sqlx-sqlite",
]
db-mysql = [
    "database",
    "sqlx/mysql",
    "sea-orm/sqlx-mysql",
    "sea-orm-migration/sqlx-mysql",
]

# Authentication, sessions, authorization policies, password hashing.
auth = [
    "dep:argon2",
    "dep:tower-sessions",
    "dep:secrecy",
    "dep:zeroize",
    "dep:time",
]

# Request validation built on `validator`.
validation = ["dep:validator"]

# Cache: Valkey/Redis client.
cache = ["dep:redis"]

# Storage: filesystem by default; S3-compatible behind `storage-s3`.
storage-fs = ["dep:opendal", "dep:bytes", "dep:futures", "opendal/services-fs"]
storage-s3 = ["storage-fs", "opendal/services-s3", "opendal/http-transport-reqwest", "opendal/executors-tokio"]

# Mail: lettre SMTP.
mail = ["dep:lettre", "dep:url", "dep:percent-encoding"]

# Jobs: the durable queue (SKIP LOCKED on Postgres/MySQL, BEGIN IMMEDIATE on
# SQLite), worker runtime, scheduler.
# `database` brings in sqlx (with the PgPool), chrono, and uuid.
jobs = [
    "database",
    "dep:tokio",
    "dep:tokio-util",
]

# Events + listeners: in-process typed dispatch.
events = []

# API: problem details (RFC 9457), typed API responses, OpenAPI.
api = ["dep:http", "dep:validator"]

# Observability: tracing.
observe = ["dep:tracing", "dep:tracing-subscriber", "dep:uuid"]

# Static pages / assets / root HTML document.
pages = ["dep:http", "dep:tokio"]

# Realtime WebSocket + SSE wrappers over axum.
realtime = ["dep:tokio", "dep:futures", "dep:bytes"]

# The `arc` CLI, generators, and the canonical application templates.
# The `arc` binary. It depends on `dev-proxy` because `arc dev` is a
# supervisor that reuses the dev proxy's Vite detection and IPC forwarding
# rather than reimplementing them -- two spellings of "is this Vite's?" would
# eventually disagree, and the whole point of the one-port design is that
# they cannot.
cli = [
    "dep:clap",
    "dep:tokio",
    "dep:tokio-util",
    "dep:notify",
    "dev-proxy",
    "templates",
    # `arc routes`, `arc typegen` and `arc build` read the UAG artifact back
    # from JSON and run its validator and codegen, so the CLI cannot be built
    # without it.
    "uag",
]
templates = []

# Developer one-port proxy (framework internal; powers `arc dev`).
dev-proxy = ["dep:hyper", "dep:hyper-util", "dep:tokio"]

# The Unified Application Graph: one deterministic artifact assembled from
# the `&'static` metadata the DSL macros already emit, and the codegen that
# turns it into TypeScript and OpenAPI. Consumed by `arc typegen` / `arc dev`
# / `arc routes`; nothing on the request path reads it.
uag = ["dx", "inertia"]

# In-process test harness: `TestApp`, the fluent client, the assertions, and
# the fakes. A dev-dependency feature -- an application enables it under
# `[dev-dependencies]`, never under `[dependencies]`.
test-kit = ["macros", "dep:http-body-util", "dep:tower-sessions-memory-store"]

# Sessions kept in the application's own database instead of in memory.
#
# Off by default, and deliberately so: turning it on for everybody would put
# a table and a migration into builds that never asked for one. An
# application opts in, and `arc new` opts in for it.
#
# It rides on the `sqlx` that `database` already brings, so the only new
# crates are `sha2` (the session id is stored as a digest) and `async-trait`
# (what `tower_sessions::SessionStore` is declared with) -- both already in
# the dependency graph that `auth` and `database` produce.
session-store-db = ["auth", "database", "dep:sha2", "dep:async-trait"]

# OAuth 2.0 Authorization Code + PKCE. Provider-agnostic: an application
# names its own endpoints, and the bundled presets are plain consts.
oauth = ["dep:oauth2", "dep:url"]

# OpenTelemetry traces over OTLP, plus the Prometheus text endpoint.
# An operator opt-in: the exporter stack is large and most apps never
# enable it.
otel = [
    "observe",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

# Serve the generated OpenAPI document and an interactive reference at
# `/_arcature/openapi.json` and `/_arcature/docs`. Off in production
# builds by default -- an API description is a map of the attack surface.
api-docs = ["api", "uag"]

# File uploads: `multipart/form-data` request bodies, bounded, sanitized and
# streamed to a storage disk.
#
# Off by default, and that is the security decision, not a packaging one. An
# upload endpoint is the largest attacker-authored surface a web application
# has -- the filename, the declared content type and the byte count all come
# from the client -- and a build with no upload route has no business carrying
# a multipart parser for one. Enabling `uploads` is the moment an application
# accepts that surface, so it is spelled out in the manifest.
#
# It pulls `validation` (the extractor lives beside the other validated
# extractors and reports RFC 9457 problem details) and `storage-fs` (an upload
# is written to a storage disk, never to a path the request named).
#
# `dep:tokio` is here for one thing: `tokio::time::timeout`. A byte cap cannot
# express "the client stopped sending", because a request that never finishes
# never exceeds anything -- the only bound that catches a slowloris is a clock,
# and the clock has to be the runtime's. Nothing else is pulled in; `tokio` is
# already on in every build that has `macros`, `jobs`, `cli`, `pages` or
# `realtime`, which is every default build.
uploads = ["axum/multipart", "validation", "storage-fs", "dep:tokio", "dep:unicode-normalization", "dep:sha2", "dep:infer"]

# Compiled HTML views (feature `views`).
#
# Askama compiles a template into Rust code at build time. That is the whole
# reason this feature names askama and not minijinja, tera or handlebars: a
# runtime template engine carries a parser and an expression evaluator that
# run inside the request path, which is where server-side template injection
# lives and SSTI is the shortest route from user input to remote code
# execution. With a compile-time engine there is no parser at runtime at all,
# so the class of bug is not mitigated, it is absent.
#
# The trade accepted in exchange: editing a template needs a rebuild.
#
# Off by default. A generated Arcature application renders its pages through
# Inertia, so the server-rendered view layer is for the applications that want
# HTML from the server -- and a build that never renders one has no business
# carrying a template compiler.
views = ["dep:askama"]

# Localization: Fluent translation catalogs (feature `i18n`).
#
# Off by default. An application that ships one language should not carry a
# message parser, a plural-rule table and a formatter to say so.
#
# The engine is Mozilla Fluent (`fluent-bundle`) rather than a
# `HashMap<String, String>`, because the map is wrong the moment a language
# has more than two plural forms. Fluent carries the CLDR plural categories,
# gender-agreeing selectors, and locale-aware number formatting; a key/value
# map carries none of them and cannot be taught to.
#
# The trade, stated plainly: Fluent parses `.ftl` text at runtime, and a
# runtime parser is what `views` picked askama specifically to avoid. The
# difference is who writes the input. A template renders attacker-supplied
# values; a catalog is a file the developer wrote, that lives in the
# repository, and that a request never names, supplies or selects by path.
# `src/i18n/mod.rs` states that boundary and what has to stay true for it to
# hold.
#
# `default-features = false` on both: `fluent-bundle`'s only optional feature
# is `all-benchmarks`, and `unic-langid`'s are `macros`, `likelysubtags` and
# `serde` -- a proc-macro, a data table, and a derive none of which this
# crate needs.
i18n = ["dep:fluent-bundle", "dep:unic-langid"]

# Application-level authenticated encryption: `crypt::Encrypter`, which turns
# bytes into a versioned, self-describing token and refuses to hand back a
# single byte of a token that has been altered.
#
# Off by default, because an application that never encrypts anything should
# not carry a cipher, and because the moment a build can produce ciphertext is
# the moment somebody has to own a key rotation story. Enabling it is that
# decision, written down in the manifest.
#
# `dep:hmac` + `dep:sha2` are here for the subkey derivation, not for the
# cipher: `AppKey` never hands `APP_KEY` itself to an algorithm, it derives a
# labelled 32-byte subkey per consumer. There is no `dep:subtle`, because the
# only comparison in this feature is the AEAD's own tag check, which
# `chacha20poly1305` already does in constant time.
crypt = [
    "dep:chacha20poly1305",
    "dep:secrecy",
    "dep:zeroize",
    "dep:hmac",
    "dep:sha2",
]

# Signed, expiring URLs: `crypt::UrlSigner`, which mints a link that carries
# its own proof of origin and its own deadline, and refuses one that has been
# edited by a byte.
#
# A separate feature from `crypt` rather than a part of it, because the two
# have different costs and different reasons. Signing needs a MAC; encrypting
# needs a cipher. An application that only wants a one-hour download link
# should not pull an AEAD into its graph to get one, and an application that
# only encrypts should not carry a URL parser.
#
# `dep:subtle` is the load-bearing one. Comparing a presented MAC with `==`
# returns at the first differing byte, which is a timing oracle: an attacker
# who can measure it forges a signature in a few thousand guesses rather than
# 2^256. `subtle::ConstantTimeEq` reads every byte every time. There is no
# `==` on a signature anywhere in this crate.
signed-urls = [
    "dep:secrecy",
    "dep:zeroize",
    "dep:hmac",
    "dep:sha2",
    "dep:subtle",
    "dep:percent-encoding",
]

# Full features convenience alias (everything except operator opt-ins).
fullstack = [
    "macros",
    "dx",
    "inertia",
    "database",
    "db-postgres",
    "auth",
    "validation",
    "cache",
    "storage-fs",
    "storage-s3",
    "mail",
    "jobs",
    "events",
    "api",
    "observe",
    "pages",
    "realtime",
    "cli",
    "templates",
    "dev-proxy",
    "uag",
    "uploads",
    "views",
]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("storage"))'] }

[dependencies]
# Proc-macro crate (the #[model], #[request], #[controller], #[derive(Job)],
# #[derive(Event)] macros). A separate crate because Rust requires proc-macros
# to live in their own crate.
arcature-macros = { path = "macros", version = "=0.1.0", optional = true }

# HTTP / async runtime kernel.
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "ws", "json", "form", "query"] }
tower = { version = "0.5.3", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["net", "macros", "rt-multi-thread", "sync", "time", "io-util", "signal", "fs"], optional = true }
tokio-util = { version = "0.7.19", default-features = false, optional = true }
tower-http = { version = "0.7.0", default-features = false, features = [
    "timeout",
    "limit",
    # `fs` serves `public/` -- without it the one-port story has no
    # production half, because nothing answers for built assets.
    "fs",
    "compression-gzip",
    "compression-br",
    "cors",
    "set-header",
    "catch-panic",
] }
hyper = { version = "1.11.0", default-features = false, features = ["http1", "client"], optional = true }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"], optional = true }
http = { version = "1.3", default-features = false, optional = true }

# Serialization — always available (fundamental; already in axum's transitive
# graph so no new supply-chain surface). Used by the always-on error type.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.145" }

# CLI.
clap = { version = "4.6.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"], optional = true }

# Database.
# No driver feature here on purpose -- the `db-*` features add it. See the
# comment on the `database` feature.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "json", "uuid", "chrono"], optional = true }
sea-orm = { version = "2.0.1", default-features = false, features = ["macros", "runtime-tokio", "with-json", "with-uuid", "with-chrono"], optional = true }
sea-orm-migration = { version = "2.0.1", default-features = false, features = ["runtime-tokio"], optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["serde"], optional = true }
uuid = { version = "1.24.0", default-features = false, features = ["v4", "serde"], optional = true }

# Auth / security.
argon2 = { version = "0.5.3", default-features = false, features = ["std", "password-hash", "rand"], optional = true }
tower-sessions = { version = "0.15.0", default-features = false, features = ["axum-core", "signed"], optional = true }
secrecy = { version = "0.10.3", default-features = false, optional = true }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"], optional = true }
# Not optional: `src/http/security.rs` compiles unconditionally and mints a
# per-request CSP nonce, so the OS RNG has to be there in every build --
# including the kernel-only one with no features at all.
getrandom = { version = "0.4.3", default-features = false }
time = { version = "0.3.55", default-features = false, optional = true }
# The database session store (feature `session-store-db`) also uses `sha2`,
# declared once under "Uploads" below because a dependency can only be named
# once. It hashes the session id to get the row key, so a dump of the table is
# not a bag of live cookies.
#
# `tower_sessions::SessionStore` is declared with `#[async_trait]`, so an
# implementation has to be written with the same macro. `tower-sessions`
# itself depends on it, so this is the same crate the `auth` feature already
# compiles.
async-trait = { version = "0.1.92", default-features = false, optional = true }

# Application cryptography (feature `crypt`).
#
# `chacha20poly1305` is the AEAD behind `crypt::Encrypter`, and the variant is
# **X**ChaCha20-Poly1305 rather than the RFC 8439 one. That is the whole
# reason this crate is here instead of an AES-GCM one: AES-GCM's nonce is 96
# bits, which is small enough that a random nonce has a birthday bound a busy
# application can actually reach, and a repeated GCM nonce does not merely
# leak plaintext -- it leaks the authentication subkey, so the attacker gains
# forgery too. XChaCha20's nonce is 192 bits, where a random draw per message
# is safe for any number of messages a web application will ever send, and the
# encrypter therefore never has to ask a caller to manage a counter.
#
# RustCrypto, pure Rust, `#![no_std]` here (`alloc` is on for the `Vec`
# output, `getrandom` is off because the nonce comes from the `getrandom`
# crate this manifest already depends on unconditionally). No C and no
# assembly: `ring` and `aws-lc-rs` both carry both, and the point of this
# module's threat model is that attacker-authored bytes never reach a C
# parser. `zeroize` wipes the key schedule on drop.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"], optional = true }
#
# `hmac` derives the per-purpose subkeys from `APP_KEY`. Version 0.12 pairs
# with the `sha2` 0.10 already declared under "Uploads" below, so on a build
# that has `uploads` or `session-store-db` this adds an edge rather than a
# crate. RustCrypto, pure Rust, no C.
hmac = { version = "0.12", default-features = false, optional = true }
#
# `subtle` compares a presented signature with the expected one in time that
# does not depend on how many leading bytes matched. Its whole reason to exist
# is to be the thing the optimiser is not allowed to turn back into an early
# return, which is why this is a dependency rather than a five-line loop.
# RustCrypto-adjacent (dalek-cryptography), pure Rust, no C. Already in the
# graph beneath `argon2` and `sqlx`, so on a default build this is an edge
# rather than a crate.
subtle = { version = "2.6", default-features = false, optional = true }

# Validation.
validator = { version = "0.21.0", default-features = false, features = ["derive"], optional = true }

# Cache / jobs.
redis = { version = "1.5.0", default-features = false, features = ["tokio-comp"], optional = true }

# Storage.
opendal = { version = "0.58.1", default-features = false, optional = true }
bytes = { version = "1.12.1", default-features = false, optional = true }
futures = { version = "0.3.33", default-features = false, features = ["std"], optional = true }

# Uploads (feature `uploads`).
#
# `unicode-normalization` puts an attacker-authored filename into NFC before
# anything else looks at it. Without it, a name written with combining marks
# and the same name written precomposed are different strings to the
# reserved-name check and to the extension whitelist, while a filesystem and a
# browser render them identically -- a whitelist that compares strings the
# rest of the stack does not is a whitelist with a hole in it. Pure Rust,
# `#![deny(unsafe_code)]`, one dependency (`tinyvec`), and a table lookup
# rather than an evaluator: there is nothing here for hostile input to drive.
# No C, no OpenSSL. Already in the lock file, pulled by `idna` via `url`.
unicode-normalization = { version = "0.1.25", default-features = false, features = ["std"], optional = true }
#
# `sha2` names an uploaded object after its own bytes, so that no byte of the
# request reaches the path at all. Version 0.10 is chosen over 0.11 because
# `cookie` and `sqlx` already pull it: on a `fullstack` build this adds no
# crate to the graph, only an edge. RustCrypto, pure Rust, `no_std` here (the
# `std` feature only adds `io::Write` impls we do not use), and the default
# backend is the portable software one -- no C, no OpenSSL, no assembly unless
# the `asm` feature is asked for, and it is not. `session-store-db` shares it,
# for the row key described above.
sha2 = { version = "0.10", default-features = false, optional = true }
#
# `infer` answers "what are these bytes" from the leading magic number, and
# nothing else. The client's `Content-Type` is a string the client chose, and
# the extension is a string the client chose; the only statement about an
# upload that the client did not author is the one made by its first few
# hundred bytes. Pure Rust, `#![no_std]` here (`default-features = false`
# drops `std`, which only adds the `cfb` reader for legacy Office documents),
# **zero transitive dependencies**, and -- the reason it is this crate and not
# an image library -- it compares byte prefixes and never decodes. A decoder
# is an interpreter for attacker-controlled input and the densest source of
# memory CVEs in any web stack; a prefix comparison has no state for hostile
# bytes to drive. MIT, already on the allow-list.
infer = { version = "0.22", default-features = false, optional = true }

# Mail.
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "pool", "tokio1", "rustls", "tokio1-rustls", "aws-lc-rs", "webpki-roots", "hostname"], optional = true }
url = { version = "2.5", default-features = false, optional = true }
percent-encoding = { version = "2.3", default-features = false, optional = true }

# Observability.
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"], optional = true }
# `fmt` costs no extra crate -- it resolves to `registry` + `std`, both of
# which were already on. `ansi` is left off (it would pull `nu-ansi-term`)
# and `env-filter` too: the filter is `Targets`, which reads the same
# `target=level` syntax without a regex engine. See `observe::init`.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "fmt"], optional = true }

# OAuth (feature `oauth`). `oauth2` owns the protocol and vendors the HTTP
# client it drives for the token exchange, reachable as `oauth2::reqwest` --
# so there is deliberately no direct `reqwest` dependency here. Adding one
# would put a second major version of the same client in the graph that
# nothing in `src/oauth/` ever reaches.
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"], optional = true }

# OpenTelemetry (feature `otel`).
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.33.0", default-features = false, optional = true }

# The test kit (feature `test-kit`): collecting a response body without a
# socket, and a session store that lives for one test.
http-body-util = { version = "0.1.5", default-features = false, optional = true }
tower-sessions-memory-store = { version = "0.15.0", default-features = false, optional = true }

# `arc dev` file watching (feature `cli`).
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"], optional = true }

# Views (feature `views`). `default-features = false` drops two things on
# purpose. `config` would add `basic-toml`, `glob`, `serde` and `serde_derive`
# to the build-time graph to read an `askama.toml` this framework does not
# ship and does not document; `urlencode` would add `percent-encoding` for a
# filter an HTML template does not need, since escaping is the autoescaper's
# job and not a filter's. What is left is `derive` (the `#[derive(Template)]`
# macro) and `std`. The whole tree is pure Rust, MIT OR Apache-2.0, and every
# crate under it -- `itoa`, `memchr`, `rustc-hash`, `syn`, `quote`,
# `proc-macro2` -- is already in the lock file.
#
# `askama_axum` is deliberately absent. It was folded into askama and then
# dropped; the `IntoResponse` impl lives in `src/view/response.rs`, where it
# can answer a render failure the way the rest of the framework answers one.
askama = { version = "0.16.0", default-features = false, features = [
    "derive",
    "std",
], optional = true }

# Localization (feature `i18n`).
#
# `fluent-bundle` is the reference Rust implementation of Mozilla Fluent: the
# `.ftl` parser, the message formatter, and the CLDR plural-rule selection
# that is the whole reason a catalog here is not a `HashMap`. `unic-langid`
# is the BCP-47 language-identifier type that API is written in; it is named
# explicitly because `fluent-bundle` does not re-export it and a locale has
# to be parsed before a bundle can be built.
#
# Both are pure Rust, MIT OR Apache-2.0, and neither opens a socket, spawns a
# process, or touches the filesystem. What the subtree does add is
# `self_cell`, which contains `unsafe`. `src/i18n/mod.rs` says so, and says
# why that is accepted here.
fluent-bundle = { version = "0.16.0", default-features = false, optional = true }
unic-langid = { version = "0.9.6", default-features = false, optional = true }

# Error handling.
thiserror = { version = "2.0", default-features = false }

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["net", "macros", "rt-multi-thread", "sync", "time", "io-util", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
tempfile = { version = "3.23.0", default-features = false }
serde_urlencoded = { version = "0.7.1", default-features = false }
tower-sessions-memory-store = { version = "0.15.0", default-features = false }

# The mock OTLP collector the telemetry tests export into. Neither of these
# is a new package: `opentelemetry-otlp`'s `grpc-tonic` feature already puts
# both in `Cargo.lock`, and every feature named here (`server`, `router`,
# `codegen`) resolves to crates the lock already carries. Nothing new to
# watch for advisories, and `[dev-dependencies]` keeps it out of a
# consumer's build entirely.
#
# The alternative was to decode the OTLP protobuf and speak gRPC over HTTP/2
# by hand, and that trades a dependency already present for a hand-rolled
# implementation of the exact wire format the assertion is about -- a test
# that agrees with its own decoder bug proves nothing.
tonic = { version = "0.14.6", default-features = false, features = ["router", "server", "codegen"] }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic", "trace"] }

# Benchmarks. `default-features = false` drops `plotters` and `rayon`: the
# numbers are read from the terminal and from `target/criterion`, and a
# charting stack in the dev-dependency graph is a compile cost every
# `cargo test` pays for a report nobody opens. `async_tokio` is what lets a
# bench measure an `async fn` without hand-rolling a runtime per iteration.
criterion = { version = "0.8.2", default-features = false, features = [
    "cargo_bench_support",
    "async_tokio",
] }

# ---------------------------------------------------------------------------
# Benchmarks
# ---------------------------------------------------------------------------
#
# Each of these measures a cost the framework makes a claim about, and only
# those. `harness = false` on every entry because criterion supplies its own.
# `required-features` is what keeps a plain `cargo bench` working on the
# default feature set: a bench whose subject is not compiled is skipped
# rather than failing the run.

# The claim in `src/application/pipeline.rs`: "every stage from 4 down is off
# unless asked for". This puts a number on the unconfigured pipeline against
# a bare `axum::Router`, and on the configured one against both.
[[bench]]
name = "pipeline"
harness = false
required-features = ["inertia", "auth", "observe"]

# The per-request cost of `RateLimit`, in-memory backend. A limiter is on the
# path of every request it guards, so its own cost is the thing to know.
[[bench]]
name = "rate_limit"
harness = false

# Inertia's two response shapes: the first-visit HTML document and the
# subsequent JSON page object. Every page a browser sees pays one of these.
[[bench]]
name = "inertia_render"
harness = false
required-features = ["inertia"]

# UAG assembly and serialisation. `arc dev` rebuilds this artifact on every
# backend restart, inside a dev loop with a stated 2.5s budget, so its cost
# is a budget line rather than a curiosity.
[[bench]]
name = "uag"
harness = false
required-features = ["uag"]

# ---------------------------------------------------------------------------
# The development profile
# ---------------------------------------------------------------------------
#
# Debug information is the dominant cost of a debug build here, and most of it
# is never read. `line-tables-only` keeps what a backtrace needs -- file, line,
# function -- and drops what only a step debugger uses: variable locations,
# types, lexical scopes. Measured on a generated application, dropping the
# equivalent information halved the time spent generating code and linking.
#
# This is the same setting the scaffold gives a generated application, so a
# contributor and a user get the same trade. Anyone who wants a full step
# debugger can override it for one run with `CARGO_PROFILE_DEV_DEBUG=2`.
#
# `split-debuginfo` is the obvious next lever and is deliberately absent. It
# is target-specific -- `rustc --print split-debuginfo` reports `packed` as
# the only stable value on `*-pc-windows-msvc`, which is what MSVC already
# does by writing a `.pdb` beside the executable -- so setting it
# unconditionally would either be a no-op or a hard error depending on who
# runs the build.
[profile.dev]
debug = "line-tables-only"

# ---------------------------------------------------------------------------
# The proc-macro build path
# ---------------------------------------------------------------------------
#
# `arcature-macros` and the `syn`/`quote`/`proc-macro2` stack beneath it are
# compiler plugins: they are built for the host, loaded by rustc, and then
# *executed* once per macro invocation in every crate that uses one. Their
# compiled speed is a tax on every subsequent build in the workspace, not just
# on the build that produced them.
#
# `build-override` covers exactly that set -- build scripts, proc-macro
# crates, and their dependencies -- and leaves the profile of the code being
# shipped untouched. Optimising it is a one-time cost paid into `target/`;
# dropping its debug information costs nothing, because nobody steps through
# `syn` in a debugger while debugging an application.
#
# Measured on a generated application: on a one-line handler change,
# `arcature-macros` is already fresh and is not rebuilt. This section is not
# about keeping the macro crate off the rebuild path -- Cargo does that
# already -- but about the expansion cost it charges while it sits there.
[profile.dev.build-override]
opt-level = 2
debug = false
